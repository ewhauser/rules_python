[workspace]
resolver = "2"
members = [
    "crates/python_import_extractor",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bazel-contrib/rules_python"

[workspace.dependencies]
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
