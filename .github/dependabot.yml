---
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directories:
      # Maintain dependencies for our tools
      - "/docs"
      - "/tools/publish"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
